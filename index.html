<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de salas · ATTRAPI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234a0f24'/%3E%3Crect x='6.5' y='8.5' width='19' height='17' rx='2.6' fill='%23ffffff'/%3E%3Crect x='6.5' y='8.5' width='19' height='5' rx='2.6' fill='%23b08a2e'/%3E%3Crect x='6.5' y='11' width='19' height='2.5' fill='%23b08a2e'/%3E%3Crect x='10' y='5' width='2.6' height='6' rx='1.3' fill='%23f1f3f5'/%3E%3Crect x='19.4' y='5' width='2.6' height='6' rx='1.3' fill='%23f1f3f5'/%3E%3Crect x='9.4' y='16' width='5.4' height='2.8' rx='1.2' fill='%234a0f24'/%3E%3Crect x='17.2' y='16' width='5.4' height='2.8' rx='1.2' fill='%23ccd1d6'/%3E%3Crect x='9.4' y='20.4' width='5.4' height='2.8' rx='1.2' fill='%23ccd1d6'/%3E%3Crect x='17.2' y='20.4' width='5.4' height='2.8' rx='1.2' fill='%23b08a2e'/%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap');
  :root{
    --vino:#4a0f24;
    --vino-2:#67152f;
    --vino-3:#350d19;
    --oro:#b08a2e;
    --oro-osc:#8a6a1c;
    --acento-claro:#f6eef1;
    --bg:#f1f3f5;
    --surface:#ffffff;
    --borde:#dbe1e6;
    --texto:#182530;
    --suave:#5b6b7c;
    --tenue:#8b99a8;
    --st-pendiente:#d99a2b;
    --st-proxima:#b08725;
    --st-curso:#2e8b57;
    --st-concluida:#5b6b7c;
    --st-cancelada:#c0392b;
    --radio:6px;
    --radio-sm:4px;
    --sombra:0 1px 2px rgba(11,36,54,.06), 0 8px 24px -12px rgba(11,36,54,.18);
    --fuente:'Barlow', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --fuente-tit:'Barlow Condensed', -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--fuente);background:var(--bg);color:var(--texto);-webkit-font-smoothing:antialiased;min-height:100vh;}
  h1,h2,h3,h4{margin:0;font-weight:800;color:var(--vino);font-family:var(--fuente-tit);letter-spacing:.01em;}
  p{margin:0;}
  a{color:var(--vino-2);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  :focus-visible{outline:2.5px solid var(--vino-2);outline-offset:2px;border-radius:4px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important;} }
  .icono{width:18px;height:18px;flex-shrink:0;}
  .ceja{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--vino-2);}
  .mono{font-family:var(--mono);}

  /* ---------- Encabezado ---------- */
  .barra-sup{background:#fff;color:var(--vino);border:4px solid var(--vino);border-left:0;border-right:0;
    box-shadow:0 2px 10px rgba(11,36,54,.08);}
  .barra-sup .interior{max-width:1180px;margin:0 auto;padding:14px 22px;display:grid;
    grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;}
  .titulos .t1{font-family:var(--fuente-tit);font-size:21px;font-weight:800;letter-spacing:.02em;line-height:1.1;}
  .titulos .t2{font-size:11.5px;color:var(--vino-2);letter-spacing:.06em;text-transform:uppercase;font-weight:700;line-height:1.3;}
  .logo-centro{height:42px;width:auto;object-fit:contain;justify-self:center;user-select:none;-webkit-user-drag:none;}
  .acciones-sup{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-self:end;}
  @media (max-width:860px){
    .barra-sup .interior{grid-template-columns:1fr auto;grid-template-areas:'titulos logo' 'acciones acciones';}
    .titulos{grid-area:titulos;}
    .logo-centro{grid-area:logo;height:36px;}
    .acciones-sup{grid-area:acciones;justify-self:start;}
  }

  main{max-width:1180px;margin:0 auto;padding:24px 22px 56px;}
  .encab-vista{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .encab-vista h1{font-size:30px;line-height:1.1;}
  .encab-vista .sub{font-size:12.5px;color:var(--suave);margin-top:3px;}

  /* ---------- Botones ---------- */
  .btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;border-radius:var(--radio-sm);padding:9px 14px;font-size:13px;font-weight:700;white-space:nowrap;border:1.5px solid var(--borde);background:#fff;color:var(--vino);}
  .btn:hover{background:var(--bg);}
  .btn-oro{background:var(--oro);color:#fff;border-color:var(--oro);}
  .btn-oro:hover{background:var(--oro-osc);border-color:var(--oro-osc);}
  .btn-vino{background:var(--vino);color:#fff;border-color:var(--vino);}
  .btn-vino:hover{background:var(--vino-2);border-color:var(--vino-2);}
  .btn-verde{background:var(--st-curso);color:#fff;border-color:var(--st-curso);}
  .btn-verde:hover{filter:brightness(.93);}
  .btn-peligro{background:#fff;border-color:#f0c6c1;color:#b4392e;}
  .btn-peligro:hover{background:#fcebea;}
  /* Botones del encabezado, ahora que el fondo es blanco */
  .btn-claro{background:#fff;border-color:var(--borde);color:var(--vino);}
  .btn-claro:hover{background:var(--bg);border-color:var(--vino-2);}
  .btn:disabled{opacity:.55;cursor:not-allowed;}
  .btn-icono{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border-radius:var(--radio-sm);border:1.5px solid var(--borde);background:#fff;color:var(--suave);}
  .btn-icono:hover{background:var(--bg);color:var(--vino);}
  .btn-icono.peligro{color:#b4392e;border-color:#f0c6c1;}
  .btn-icono.peligro:hover{background:#fcebea;}
  .btn-texto{background:none;border:none;color:var(--vino-2);font-size:12.5px;font-weight:700;text-decoration:underline;padding:0;}

  /* ---------- Paneles ---------- */
  .panel{background:var(--surface);border:1px solid var(--borde);border-radius:var(--radio);box-shadow:var(--sombra);padding:18px;margin-bottom:16px;}
  .panel h3{font-size:15px;margin-bottom:3px;}
  .panel .desc{font-size:12px;color:var(--suave);margin-bottom:14px;}
  .aviso-caja{background:var(--acento-claro);color:var(--vino-3);border-radius:var(--radio-sm);padding:10px 12px;font-size:12px;line-height:1.6;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start;}
  .aviso-caja .icono{margin-top:1px;color:var(--vino-2);}
  .aviso-caja a{color:var(--vino-2);text-decoration:underline;word-break:break-all;}
  .aviso-caja.alerta{background:#fdf1ec;color:#8a3522;}
  .aviso-caja.alerta .icono{color:#c0392b;}
  .barra-herr{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;}

  /* ---------- Formularios ---------- */
  .rejilla{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .rejilla .todo{grid-column:1/-1;}
  .campo{display:flex;flex-direction:column;gap:5px;}
  .campo label{font-size:12px;font-weight:700;color:var(--suave);letter-spacing:.02em;}
  .campo input,.campo select,.campo textarea{border:1.5px solid var(--borde);border-radius:var(--radio-sm);padding:10px 12px;font-size:14px;color:var(--texto);background:#fbfcfd;width:100%;}
  .campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--vino-2);background:#fff;}
  .campo textarea{resize:vertical;min-height:88px;}
  .campo .pista{font-size:11.5px;color:var(--tenue);}
  .caja-clave{position:relative;}
  .caja-clave input{padding-right:44px;}
  .ver-clave{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;
    color:var(--tenue);padding:7px;display:flex;border-radius:50%;}
  .ver-clave:hover{color:var(--vino);background:var(--bg);}
  .marca-check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--texto);font-weight:600;cursor:pointer;}
  .marca-check input{width:16px;height:16px;accent-color:var(--vino);}
  .acciones-form{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .error-form{display:none;font-size:12.5px;color:#c0392b;margin-top:10px;font-weight:600;}
  @media (max-width:620px){ .rejilla{grid-template-columns:1fr;} }

  /* ---------- Tarjetas de salas ---------- */
  .tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:18px;align-items:stretch;}
  /* Tarjeta vertical tipo cartel: al pasar el mouse se levanta y crece un poco. */
  .tarjeta{display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--borde);
    border-radius:10px;overflow:hidden;padding:0;cursor:pointer;text-align:left;width:100%;font-family:inherit;
    text-decoration:none;color:inherit;
    box-shadow:0 1px 2px rgba(11,36,54,.07);
    transition:transform .2s cubic-bezier(0,0,.2,1), box-shadow .2s cubic-bezier(0,0,.2,1), border-color .2s cubic-bezier(0,0,.2,1);}
  .tarjeta:hover, .tarjeta:focus-visible{transform:translateY(-7px) scale(1.035);
    box-shadow:0 22px 44px -16px rgba(74,15,36,.5);border-color:var(--oro);}
  .tarjeta.activa{border-color:var(--vino);box-shadow:0 10px 26px -14px rgba(74,15,36,.55);}
  .tarjeta .cartel{position:relative;height:148px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,var(--vino-3) 0%,var(--vino) 48%,var(--vino-2) 100%);overflow:hidden;}
  .tarjeta .cartel::after{content:'';position:absolute;inset:0;z-index:3;
    background:radial-gradient(circle at 70% 15%,rgba(176,138,46,.35),transparent 60%);opacity:0;transition:opacity .25s cubic-bezier(0,0,.2,1);}
  .tarjeta:hover .cartel::after{opacity:1;}
  /* Si la sala tiene foto, se pone de fondo y crece un poco al pasar el mouse. */
  .tarjeta .cartel .foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;
    transition:transform .35s cubic-bezier(0,0,.2,1);}
  .tarjeta:hover .cartel .foto{transform:scale(1.07);}
  .tarjeta .cartel .velo{position:absolute;inset:0;z-index:2;
    background:linear-gradient(to top,rgba(53,13,25,.62),rgba(53,13,25,.2) 55%,rgba(53,13,25,.35));}
  /* La capacidad va al centro del panel, como píldora. */
  .tarjeta .cupo-cartel{position:relative;z-index:4;display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.96);color:var(--vino);border-radius:999px;padding:10px 20px;
    font-family:var(--fuente-tit);font-size:17px;font-weight:800;letter-spacing:.03em;
    box-shadow:0 8px 22px rgba(20,5,12,.35);transition:transform .25s cubic-bezier(0,0,.2,1);}
  .tarjeta:hover .cupo-cartel{transform:scale(1.07);}
  .tarjeta .cupo-cartel .icono{width:18px;height:18px;}
  .tarjeta .insignia{position:absolute;top:10px;left:10px;z-index:4;background:#fff;color:var(--vino);
    border-radius:4px;padding:4px 9px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    font-family:var(--fuente-tit);}
  .tarjeta .insignia.ocupada{background:#fdeceb;color:#a33225;}
  .tarjeta .insignia.libre{background:#e9f4ee;color:#1f6b42;}
  .tarjeta .cuerpo{padding:14px 15px 16px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .tarjeta h3{font-size:21px;line-height:1.12;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;}
  .chips span{display:inline-flex;align-items:center;gap:5px;background:#f5eee0;color:#6b5210;
    border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;}
  .chips span.cupo{background:var(--acento-claro);color:var(--vino);font-weight:700;}
  .chips .icono{width:14px;height:14px;}
  .tarjeta .llamada{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12.5px;font-weight:800;
    color:var(--oro-osc);font-family:var(--fuente-tit);letter-spacing:.03em;text-transform:uppercase;}
  .tarjeta .llamada .icono{width:15px;height:15px;transition:transform .2s cubic-bezier(0,0,.2,1);}
  .tarjeta:hover .llamada .icono{transform:translateX(4px);}
  .selector-sala{display:flex;align-items:center;gap:8px;}
  .selector-sala select{padding:8px 10px;border:1.5px solid var(--borde);border-radius:4px;font-size:13px;
    background:#fbfcfd;color:var(--texto);font-family:inherit;}

  /* ---------- Agenda del día ---------- */
  /* Sin overscroll-behavior: al llegar al tope el scroll continúa con la página. */
  .agendas-scroll{overflow:auto;max-height:460px;}
  .agendas{display:grid;gap:12px;min-width:620px;}
  .cab-sala, .cab-hora{position:sticky;top:0;z-index:6;background:var(--surface);}
  .cab-sala{font-family:var(--fuente-tit);font-size:15px;font-weight:800;color:var(--vino);
    letter-spacing:.02em;padding:0 0 8px;border-bottom:2px solid var(--borde);text-align:center;}
  .cab-sala small{display:block;font-family:var(--fuente);font-size:11px;font-weight:600;color:var(--tenue);
    letter-spacing:.04em;text-transform:uppercase;margin-top:2px;}
  .col-horas{position:relative;height:720px;}
  .col-horas span{position:absolute;right:8px;transform:translateY(-50%);font-size:11.5px;color:var(--tenue);font-family:var(--mono);}
  .agenda{position:relative;height:720px;border-left:1px solid var(--borde);}
  .linea{position:absolute;left:0;right:0;border-top:1px solid #eceef2;}
  .bloque{position:absolute;border-radius:5px;padding:5px 8px;font-size:12.5px;overflow:hidden;cursor:pointer;border:0;text-align:left;line-height:1.3;font-family:inherit;}
  .bloque strong{display:block;font-family:var(--mono);font-size:11.5px;}
  .bloque.aceptada{background:var(--vino);color:#fff;}
  .bloque.en_curso{background:var(--st-curso);color:#fff;}
  .bloque.concluida{background:#7d8a97;color:#fff;}
  .bloque.pendiente{background:repeating-linear-gradient(45deg,#f8f0d8,#f8f0d8 8px,#efe2bb 8px,#efe2bb 16px);color:#5a4510;border:1px dashed var(--oro);}
  .bloque.bloqueo{background:repeating-linear-gradient(45deg,#fbeaea,#fbeaea 8px,#f4d6d4 8px,#f4d6d4 16px);color:#8d2e22;border:1px dashed #c0392b;}
  /* Línea de la hora actual */
  .ahora{position:absolute;left:0;right:0;z-index:3;border-top:2px solid #c0392b;pointer-events:none;}
  .ahora::before{content:'';position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:#c0392b;}
  .marca-ahora{position:absolute;right:8px;transform:translateY(-50%);font-size:10.5px;font-weight:800;
    color:#c0392b;font-family:var(--mono);background:var(--surface);padding:1px 2px;}
  .leyenda{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--suave);margin-top:14px;}
  .leyenda i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px;}

  /* ---------- Tablero ---------- */
  .tablero-marco{border-radius:var(--radio-sm);border:1px solid #d9dee3;}
  .fila.encabezado{border-radius:3px 3px 0 0;}
  .fila:last-child{border-radius:0 0 3px 3px;}
  /* Globo con los nombres: aparece al pasar el mouse sobre el número de personas. */
  .globo{position:relative;border-bottom:1px dotted currentColor;cursor:help;}
  .globo::after{content:attr(data-globo);position:absolute;left:0;bottom:calc(100% + 9px);z-index:50;
    background:var(--vino);color:#fff;padding:8px 11px;border-radius:6px;font-size:12.5px;font-weight:600;
    line-height:1.45;width:max-content;max-width:min(280px,70vw);white-space:normal;text-align:left;
    font-family:var(--fuente);text-transform:none;letter-spacing:normal;
    box-shadow:0 10px 24px rgba(0,0,0,.28);opacity:0;visibility:hidden;transition:opacity .12s;}
  .globo::before{content:'';position:absolute;left:14px;bottom:calc(100% + 3px);z-index:51;
    border:6px solid transparent;border-top-color:var(--vino);opacity:0;visibility:hidden;transition:opacity .12s;}
  .globo:hover::after,.globo:focus::after,.globo:hover::before,.globo:focus::before{opacity:1;visibility:visible;}
  .fila{display:grid;grid-template-columns:1.1fr 1fr 1.1fr 1.5fr 1fr 1.1fr;align-items:center;background:#fff;}
  .fila.encabezado{background:#e4e7eb;}
  .fila.encabezado .celda{color:var(--vino);font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
  .fila:not(.encabezado){border-top:1px solid #e4e7eb;}
  .fila.bloqueada{background:#fbefef;}
  .tablero-marco.con-gestion .fila{grid-template-columns:1fr .9fr .9fr 1.4fr .9fr .9fr 1.3fr;}
  .celda{padding:12px 14px;font-family:var(--mono);font-size:12.5px;color:var(--vino);}
  .celda.hora{font-weight:800;}
  .celda.sala{font-weight:800;color:var(--oro-osc);text-transform:uppercase;letter-spacing:.03em;}
  .celda .sub-dato{display:flex;align-items:flex-start;gap:5px;margin-top:4px;font-size:11px;color:var(--suave);font-weight:600;font-family:var(--fuente);}
  .celda .sub-dato .icono{width:12px;height:12px;margin-top:2px;}
  .celda.estatus span{display:inline-block;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11px;border:1.5px solid;border-radius:20px;padding:4px 10px;text-align:center;}
  .celda.gestion{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .celda.gestion select{border:1.5px solid var(--borde);border-radius:var(--radio-sm);padding:6px 8px;font-size:12px;background:#fbfcfd;max-width:130px;}
  .vacio{padding:34px 14px;text-align:center;color:var(--tenue);font-size:13px;grid-column:1/-1;}
  @media (max-width:900px){
    .fila{grid-template-columns:1fr;gap:2px;padding:10px 0;}
    .fila.encabezado{display:none;}
    .celda{padding:4px 14px;}
    .celda::before{content:attr(data-et);display:block;font-family:var(--fuente);font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue);margin-bottom:2px;}
  }

  /* ---------- Solicitudes pendientes (admin) ---------- */
  .sol-card{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--borde);flex-wrap:wrap;}
  .sol-card:last-child{border-bottom:none;}
  .sol-card .tit{font-size:14.5px;font-weight:800;color:var(--vino);font-family:var(--fuente-tit);letter-spacing:.02em;}
  .sol-card .dato{font-size:12px;color:var(--suave);margin-top:2px;}
  .sol-card .dato b{color:var(--texto);}
  .sol-card .choque{display:flex;align-items:flex-start;gap:6px;color:#c0392b;font-weight:700;font-size:12px;margin-top:4px;}
  .sol-card .sol-acciones{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;}
  .fila-lista{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--borde);font-size:13px;color:var(--vino);}
  .fila-lista:last-child{border-bottom:none;}
  .fila-lista .acc{display:flex;gap:6px;}

  /* ---------- Pantalla de proyección ---------- */
  .kiosko{min-height:100vh;background:#f0f1f3;padding:34px clamp(18px,4vw,70px);font-family:var(--fuente);}
  .kiosko-logos{display:flex;align-items:center;justify-content:center;gap:clamp(20px,4vw,56px);flex-wrap:wrap;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #d9dee3;}
  .kiosko-logos img{height:clamp(34px,4.4vw,56px);width:auto;object-fit:contain;}
  .kiosko-encab{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px;}
  .kiosko-tit{font-family:var(--fuente-tit);font-size:clamp(26px,3.4vw,44px);font-weight:800;color:var(--vino);letter-spacing:.01em;}
  .kiosko-reloj{font-size:clamp(14px,1.4vw,21px);font-weight:700;color:var(--suave);font-family:var(--mono);}
  .kiosko .tablero-marco{border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.08);border:none;}
  .kiosko .fila.encabezado{border-radius:14px 14px 0 0;}

<script>
// ============================================================

const API_URL = 'https://script.google.com/macros/s/AKfycbwyfNK36rn9eO7h8HJGgaH0Bbrrm8-7E2WsSgwKbFw5u9IvIgEVOWb6fbOWT4Zfts344A/exec';
// ============================================================

const LOGO = 'logos/logo_attrapi.png';
const HORA_MIN = 7, HORA_MAX = 20, PASO = 30;     // la agenda y los horarios van de 7:00 a 20:00, de 30 en 30 minutos
const EQUIPAMIENTO = ['TV', 'Wifi'];

// Foto de cada sala. Para agregar otra: deja el archivo en la carpeta salas/

const ZONA = 'America/Mexico_City';

// Listas que se usan la primera vez (después el panel y las propias solicitudes las van llenando).
const PROYECTOS_BASE = [
  'Querétaro - Irapuato', 'Saltillo - Nuevo Laredo', 'Aifa - Pachuca', 'México - Querétaro',
  'Saltillo - Monterrey', 'Monterrey - Nuevo Laredo', 'Querétaro - San Luis Potosí',
  'San Luis Potosí - Saltillo', 'Irapuato - Guadalajara', 'TIMT - Tren Interurbano México Toluca',

];

const ESTATUS = {
  pendiente: { etiqueta:'PENDIENTE', color:'var(--st-pendiente)', texto:'Por confirmar' },
  aceptada:  { etiqueta:'PRÓXIMA',   color:'var(--st-proxima)',   texto:'Confirmada' },

// Estatus que apartan la sala. Una solicitud pendiente también aparta, para que dos

const parametros = new URLSearchParams(location.search);
const VISTA = parametros.has('tablero') ? 'tablero'
            : parametros.has('solicitud') ? 'solicitud'

const estado = {
  backendNuevo: false, salas: [], reservaciones: [], proyectos: [], areas: [], bloqueos: [], sugeridos: [],

/* ------------------------------------------------------------
   Utilidades
   ------------------------------------------------------------ */
function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function aBool(v, pordefecto) {
  if (v === undefined || v === null || v === '') return pordefecto !== false;
  if (typeof v === 'boolean') return v;
  const t = String(v).trim().toLowerCase();
  return !(t === 'false' || t === '0' || t === 'no');
}
// Siempre la fecha de México, aunque la computadora o la tele tengan otra zona horaria.
function hoyMx() {
  try {
    const p = {};
    new Intl.DateTimeFormat('en-CA', { timeZone: ZONA, year:'numeric', month:'2-digit', day:'2-digit' })
      .formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
    return p.year + '-' + p.month + '-' + p.day;
  } catch (e) {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
}
// Hora de México en minutos desde medianoche, para no ofrecer horarios que ya pasaron.
function minutosAhoraMx() {
  try {
    const p = {};
    new Intl.DateTimeFormat('es-MX', { timeZone: ZONA, hour12: false, hour: '2-digit', minute: '2-digit' })
      .formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
    return (Number(p.hour) % 24) * 60 + Number(p.minute);
  } catch (e) {
    const d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  }
}
// Primer bloque que todavía se puede pedir en una fecha: en días futuros, todos;
// hoy, el bloque en curso (a las 11:50 el de las 11:30) y los siguientes.
function primerBloqueDe(fecha) {
  if (fecha !== hoyMx()) return null;
  return Math.floor(minutosAhoraMx() / PASO) * PASO;
}
function fmtFecha(iso) {
  const p = String(iso || '').split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : (iso || '—');
}
function capitalizar(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
function fechaLarga(f) {
  const p = String(f || '').split('-');
  if (p.length !== 3) return f || '';
  return capitalizar(new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long', year:'numeric' }));
}
function toMin(t) {
  if (!t) return null;
  const p = String(t).split(':');
  if (p.length < 2) return null;
  const h = Number(p[0]), m = Number(p[1]);
  return (isNaN(h) || isNaN(m)) ? null : h * 60 + m;
}
function aHora(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function enlaceSeguro(u) { const t = String(u || '').trim(); return /^https?:\/\//i.test(t) ? t : ''; }
// "8" → "8 personas". Lo que no es número ("Más de 30") se deja tal cual.
function textoPersonas(v) {
  const t = String(v == null ? '' : v).trim();
  if (!t) return '';
  const n = Number(t);
  return n ? n + (n === 1 ? ' persona' : ' personas') : t + ' personas';
}
// Se muestra sólo cuánta gente viene; los nombres salen en el globo al pasar el mouse.
function htmlGente(r) {
  const num = textoPersonas(r.num_participantes), nombres = String(r.participantes || '').trim();
  if (!num) return esc(nombres);
  if (!nombres) return esc(num);
  return '<span class="globo" tabindex="0" data-globo="' + esc(nombres) + '">' + esc(num) + '</span>';
}
// Si la imagen no se puede cargar, se quita junto con su velo y la tarjeta
// se queda con el panel guinda.
function fotoFalla(img) {
  const velo = img.parentElement && img.parentElement.querySelector('.velo');
  if (velo) velo.remove();
  img.remove();
}
// El estatus que se ve en pantalla lo decide la hora, no hace falta que el
// administrador vaya moviendo cada reunión: lo que ya terminó sale como
// concluida, lo que está corriendo como en curso y lo demás como próxima.
// Lo que se marcó a mano como cancelada, rechazada o concluida se respeta.
function estatusVisible(r) {
  if (['cancelada', 'rechazada', 'concluida', 'pendiente'].indexOf(r.estatus) !== -1) return r.estatus;
  const hoy = hoyMx();
  if (r.fecha < hoy) return 'concluida';
  if (r.fecha > hoy) return 'aceptada';
  const i = toMin(r.inicio);
  if (i === null) return r.estatus;
  const f = toMin(r.fin) === null ? i + PASO : toMin(r.fin);
  const ahora = minutosAhoraMx();
  if (ahora >= f) return 'concluida';
  if (ahora >= i) return 'en_curso';
  return 'aceptada';
}
function nombreSala(id) { const s = estado.salas.find(s => s.id === id); return s ? s.nombre : (id || '—'); }
function salaPorNombre(n) { return estado.salas.find(s => s.nombre === n); }
function aviso(texto) {
  const a = document.getElementById('aviso');
  a.textContent = texto; a.style.display = 'block';
  clearTimeout(aviso.t); aviso.t = setTimeout(() => { a.style.display = 'none'; }, 5000);
}
function unicos(lista) {
  const vistos = {}, out = [];
  lista.forEach(v => { const t = String(v || '').trim(); if (t && !vistos[t.toLowerCase()]) { vistos[t.toLowerCase()] = 1; out.push(t); } });
  return out.sort((a, b) => a.localeCompare(b, 'es'));
}
const ICONOS = {
  mas:'<path d="M12 5v14M5 12h14"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  editar:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  basura:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  candado:'<rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  liga:'<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>',
  ojo:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  ojoNo:'<path d="M3 3l18 18"/><path d="M10.6 5.2A10 10 0 0 1 22 12s-1.3 2.3-3.7 4.1M6.3 6.7C3.7 8.5 2 12 2 12s4 7 10 7a9.7 9.7 0 0 0 4-.8"/>',
  sala:'<rect x="5" y="9.2" width="14" height="5.6" rx="2.8"/><circle cx="3.6" cy="7" r="1.5"/><circle cx="12" cy="5.4" r="1.5"/><circle cx="20.4" cy="7" r="1.5"/><circle cx="3.6" cy="17" r="1.5"/><circle cx="12" cy="18.6" r="1.5"/><circle cx="20.4" cy="17" r="1.5"/>',
  gente:'<circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6"/><path d="M17.5 20a6.3 6.3 0 0 0-2-4.6"/>',
  check:'<path d="M4 12.5 9.5 18 20 6"/>',
  reloj:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  calendario:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  flecha:'<path d="M15 18l-6-6 6-6"/>',
  flechaDer:'<path d="M5 12h13M12.5 5.5 19 12l-6.5 6.5"/>',
  pantalla:'<rect x="2.5" y="4" width="19" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'
};
function ic(n) {
  return '<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONOS[n] || '') + '</svg>';
}

/* ------------------------------------------------------------
   Comunicación con la hoja de cálculo (Apps Script)
   ------------------------------------------------------------ */
function normRes(r) {
  return {
    id: String(r.id == null ? '' : r.id),
    sala_id: r.sala_id || '', fecha: r.fecha || '', inicio: r.inicio || '', fin: r.fin || '',
    nombre: r.nombre || '', tema: r.tema || r.asunto || '', estatus: r.estatus || 'pendiente',
    participantes: r.participantes || '', num_participantes: r.num_participantes || '',
    proyecto: r.proyecto || '', area: r.area || '',
    notas: r.notas || '', link_doc: r.link_doc || '', link_admin: r.link_admin || '',
    mostrar_proyeccion: aBool(r.mostrar_proyeccion, true),
    mostrar_participantes: aBool(r.mostrar_participantes, true),
    creado: r.creado || ''
  };
}
function normBloqueo(b) {
  const fechas = Array.isArray(b.fechas) ? b.fechas : String(b.fechas || '').split(',').map(s => s.trim()).filter(Boolean);
  const dias = Array.isArray(b.dias) ? b.dias : String(b.dias || '').split(',').map(s => s.trim()).filter(Boolean);
  return {
    id: String(b.id == null ? '' : b.id), sala_id: b.sala_id || '', fechas: fechas,
    inicio: b.inicio || '', fin: b.fin || '', motivo: b.motivo || '', descripcion: b.descripcion || '',
    mostrar_tablero: aBool(b.mostrar_tablero, true), tipo: b.tipo || 'dia', mes: b.mes || '', dias: dias
  };
}
function listaNombres(lista, respaldo) {
  const nombres = unicos((lista || []).map(x => (typeof x === 'string' ? x : (x && x.nombre) || '')));
  return nombres.length ? nombres : (respaldo || []).slice();
}
async function cargar() {
  const r = await fetch(API_URL + (API_URL.indexOf('?') === -1 ? '?' : '&') + 't=' + Date.now());
  const d = await r.json();
  if (!d || d.ok === false) throw new Error((d && d.error) || 'Respuesta inesperada del servidor');
  aplicarDatos(d);
}
// Acomoda en la página los datos que lleguen, sin importar si vinieron de una
// consulta o de la respuesta a un cambio que se acaba de guardar.
function aplicarDatos(d) {
  if (!d || !d.salas || !d.reservaciones) return false;
  estado.backendNuevo = !!d.version;
  estado.salas = (d.salas || []).map(s => ({ id: s.id, nombre: s.nombre, capacidad: s.capacidad }));
  estado.reservaciones = (d.reservaciones || []).map(normRes);
  estado.bloqueos = (d.bloqueos || []).map(normBloqueo);
  estado.proyectos = listaNombres(d.proyectos, PROYECTOS_BASE);
  estado.areas = listaNombres(d.areas, AREAS_BASE);
  estado.sugeridos = unicos(estado.reservaciones.map(r => r.participantes));
  // Con la hoja ya actualizada, los catálogos los manda el servidor (ahí se van guardando
  // los que alguien escriba en "Otro"). Con la hoja vieja, se aprenden del historial.
  if (!estado.backendNuevo) {
    estado.proyectos = unicos(estado.proyectos.concat(estado.reservaciones.map(r => r.proyecto)));
    estado.areas = unicos(estado.areas.concat(estado.reservaciones.map(r => r.area)));
  }
  if (!estado.salaId && estado.salas.length) estado.salaId = estado.salas[0].id;
  return true;
}
/* ---------- La clave del panel se queda guardada en este equipo ----------
   Se borra con el botón "Cerrar sesión" o si deja de ser válida. */
const LLAVE_CLAVE = 'claveSalas';
function claveGuardada() {
  try { return localStorage.getItem(LLAVE_CLAVE) || sessionStorage.getItem(LLAVE_CLAVE) || ''; }
  catch (e) { return ''; }
}
function recordarClave(clave) {
  try { localStorage.setItem(LLAVE_CLAVE, clave); } catch (e) {}
  try { sessionStorage.removeItem(LLAVE_CLAVE); } catch (e) {}
}
function olvidarClave() {
  try { localStorage.removeItem(LLAVE_CLAVE); } catch (e) {}
  try { sessionStorage.removeItem(LLAVE_CLAVE); } catch (e) {}
}

async function enviar(cuerpo) {
  // text/plain evita la verificación previa (CORS) que Apps Script no contesta.
  // Nunca lanza error: devuelve {ok:false, error} para que siempre se vea un aviso.
  let r;
  try {
    r = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(cuerpo) });
  } catch (e) {
    return { ok:false, error:'No se pudo conectar con la hoja de cálculo. Revisa tu conexión e intenta de nuevo.' };
  }
  let texto = '';
  try { texto = await r.text(); } catch (e) {}
  try { return JSON.parse(texto); }
  catch (e) {
    return { ok:false, error:'El servidor contestó algo que no se entiende. Revisa que la aplicación de Apps Script esté implementada con acceso “Cualquier usuario”.' };
  }
}
async function enviarAdmin(cuerpo) {
  cuerpo.clave = estado.clave;
  const lento = setTimeout(() => aviso('Guardando…'), 500);
  const r = await enviar(cuerpo);
  clearTimeout(lento);
  if (!r.ok) {
    aviso(r.error || 'No se pudo guardar el cambio.');
    if (/clave/i.test(r.error || '')) { estado.clave = ''; olvidarClave(); }
    return null;
  }
  return r;
}

/* ------------------------------------------------------------
   Ocupación: reservaciones y bloqueos
   ------------------------------------------------------------ */
function bloqueoDeDia(salaId, fecha) {
  return estado.bloqueos.find(b => b.sala_id === salaId && b.fechas.indexOf(fecha) !== -1 && !b.inicio && !b.fin) || null;
}
function bloqueosConHorario(salaId, fecha) {
  return estado.bloqueos.filter(b => b.sala_id === salaId && b.fechas.indexOf(fecha) !== -1 && b.inicio && b.fin);
}
// Franjas ya apartadas de una sala en una fecha: reuniones + bloqueos por horario.
function franjasOcupadas(salaId, fecha, excluirId) {
  const out = [];
  estado.reservaciones.forEach(r => {
    if (r.sala_id !== salaId || r.fecha !== fecha || r.id === excluirId) return;
    if (OCUPAN.indexOf(r.estatus) === -1) return;
    const i = toMin(r.inicio); if (i === null) return;
    const f = toMin(r.fin);
    out.push({ ini: i, fin: f === null ? i + PASO : f, etiqueta: (r.estatus === 'pendiente' ? 'solicitud pendiente de ' : 'reunión de ') + (r.nombre || 'otra persona'), bloqueo: false });
  });
  bloqueosConHorario(salaId, fecha).forEach(b => {
    const i = toMin(b.inicio), f = toMin(b.fin);
    if (i === null || f === null) return;
    out.push({ ini: i, fin: f, etiqueta: 'bloqueo' + (b.motivo ? ' (' + b.motivo + ')' : ''), bloqueo: true });
  });
  return out.sort((a, b) => a.ini - b.ini);
}
// Con qué se encima una reservación. Terminar justo cuando otra empieza NO cuenta.
function conflictos(res) {
  const ini = toMin(res.inicio);
  if (ini === null) return [];
  const fin = toMin(res.fin) === null ? ini + PASO : toMin(res.fin);
  const bl = bloqueoDeDia(res.sala_id, res.fecha);
  const out = bl ? ['un bloqueo de todo el día' + (bl.motivo ? ' (' + bl.motivo + ')' : '')] : [];
  franjasOcupadas(res.sala_id, res.fecha, res.id).forEach(f => {
    if (ini < f.fin && fin > f.ini) out.push(f.etiqueta + ' (' + aHora(f.ini) + '–' + aHora(f.fin) + ')');
  });
  return out;
}
function horaOcupadaInicio(ocupadas, m) { return ocupadas.some(f => m >= f.ini && m < f.fin); }
function horaOcupadaFin(ocupadas, m) { return ocupadas.some(f => m > f.ini && m <= f.fin); }
function opcionesHorario(ocupadas, seleccionInicio, seleccionFin, minimo) {
  let ini = '<option value="">Selecciona…</option>', fin = '<option value="">Selecciona…</option>';
  for (let m = HORA_MIN * 60; m <= HORA_MAX * 60; m += PASO) {
    const v = aHora(m);
    const pasoI = minimo !== null && minimo !== undefined && m < minimo;
    const pasoF = minimo !== null && minimo !== undefined && m <= minimo;
    const oi = horaOcupadaInicio(ocupadas, m), of = horaOcupadaFin(ocupadas, m);
    ini += '<option value="' + v + '"' + (oi || pasoI ? ' disabled' : '') + (v === seleccionInicio ? ' selected' : '') + '>' + v + (pasoI ? ' — ya pasó' : oi ? ' — ocupado' : '') + '</option>';
    fin += '<option value="' + v + '"' + (of || pasoF ? ' disabled' : '') + (v === seleccionFin ? ' selected' : '') + '>' + v + (pasoF ? ' — ya pasó' : of ? ' — ocupado' : '') + '</option>';
  }
  return { ini: ini, fin: fin };
}

function valorConOtro(form, nombre) {
  const sel = form.querySelector('[name="' + nombre + 'Select"]');
  if (!sel) { const d = form.querySelector('[name="' + nombre + '"]'); return d ? String(d.value || '').trim() : ''; }
  if (sel.value === '__otro__') {
    const otro = form.querySelector('[name="' + nombre + 'Otro"]');
    return otro ? String(otro.value || '').trim() : '';
  }
  return sel.value;
}
// Menú desplegable con el número de asistentes. Son muchas opciones a propósito:
// el navegador le pone su propia barra de desplazamiento al desplegarlo.
function campoNumParticipantes(valor, requerido) {
  var TOPE = 30, otros = 'Más de ' + TOPE;
  var ops = '<option value="">Selecciona…</option>', estaEnLista = false;
  for (var n = 1; n <= TOPE; n++) {
    var puesto = String(valor) === String(n);
    if (puesto) estaEnLista = true;
    ops += '<option value="' + n + '"' + (puesto ? ' selected' : '') + '>' + n + (n === 1 ? ' persona' : ' personas') + '</option>';
  }
  ops += '<option value="' + otros + '"' + (valor === otros ? ' selected' : '') + '>' + otros + ' personas</option>';
  // Si una reservación vieja trae un valor que ya no está en la lista, se conserva
  // para no borrárselo sin querer al editarla.
  if (valor && !estaEnLista && valor !== otros) ops += '<option value="' + esc(valor) + '" selected>' + esc(valor) + '</option>';
  return '<div class="campo todo"><label>Número de participantes</label>' +
    '<select name="num_participantes" id="sel-num"' + (requerido ? ' required' : '') + '>' + ops + '</select>' +
    '<div class="pista" id="pista-cupo"></div></div>';
}

// Las tres salas, una junto a la otra, con una sola columna de horas a la izquierda.
function agendasHTML() {
  const total = (HORA_MAX - HORA_MIN) * 60;
  let horas = '<div class="col-horas">';
  for (let h = HORA_MIN; h <= HORA_MAX; h++) {
    horas += '<span style="top:' + ((h - HORA_MIN) * 60 / total * 100) + '%">' + String(h).padStart(2, '0') + ':00</span>';
  }
  if (estado.fecha === hoyMx()) {
    const m = minutosAhoraMx() - HORA_MIN * 60;
    if (m >= 0 && m <= total) horas += '<span class="marca-ahora" style="top:' + (m / total * 100) + '%">' + aHora(minutosAhoraMx()) + '</span>';
  }
  horas += '</div>';
  const cabeceras = estado.salas.map(sa => {
    const bl = bloqueoDeDia(sa.id, estado.fecha);
    return '<div class="cab-sala">' + esc(sa.nombre) +
      '<small>' + (bl ? 'No disponible' : esc(sa.capacidad) + ' lugares') + '</small></div>';
  }).join('');
  return '<div class="agendas-scroll"><div class="agendas" style="grid-template-columns:52px repeat(' + estado.salas.length + ',1fr)">' +
    '<div class="cab-hora"></div>' + cabeceras + horas + estado.salas.map(sa => agendaHTML(sa.id)).join('') +
    '</div></div>';
}
function agendaHTML(salaId) {
  const total = (HORA_MAX - HORA_MIN) * 60;
  let html = '<div class="agenda">';
  for (let h = HORA_MIN; h <= HORA_MAX; h++) {
    html += '<div class="linea" style="top:' + ((h - HORA_MIN) * 60 / total * 100) + '%"></div>';
  }
  const items = estado.reservaciones
    .filter(r => r.sala_id === salaId && r.fecha === estado.fecha && OCUPAN.indexOf(r.estatus) !== -1)
    .map(r => ({ id: r.id, inicio: r.inicio, fin: r.fin, clase: estatusVisible(r), t1: r.tema || 'Reunión', t2: r.nombre }))
    .concat(bloqueosConHorario(salaId, estado.fecha)
      .map(b => ({ id: 'bloqueo:' + b.id, inicio: b.inicio, fin: b.fin, clase: 'bloqueo', t1: b.descripcion || 'Sala bloqueada', t2: b.motivo || '' })))
    .sort((a, b) => String(a.inicio).localeCompare(String(b.inicio)));

  // si dos reuniones se empalman, se reparten en columnas
  const finCol = [];
  items.forEach(r => {
    let c = finCol.findIndex(fin => fin <= r.inicio);
    if (c === -1) { c = finCol.length; finCol.push(r.fin); } else finCol[c] = r.fin;
    r._col = c;
  });
  const cols = Math.max(finCol.length, 1);

  items.forEach(r => {
    const i = toMin(r.inicio), f = toMin(r.fin);
    if (i === null) return;
    const ini = Math.max(i - HORA_MIN * 60, 0);
    const fin = Math.min((f === null ? i + PASO : f) - HORA_MIN * 60, total);
    if (fin <= ini) return;
    html += '<button class="bloque ' + esc(r.clase) + '" data-res="' + esc(r.id) + '" style="top:' + (ini / total * 100) + '%;' +
      'height:calc(' + ((fin - ini) / total * 100) + '% - 2px);left:calc(' + (r._col / cols * 100) + '% + 6px);width:calc(' + (100 / cols) + '% - 12px)">' +
      '<strong>' + esc(r.inicio) + '–' + esc(r.fin) + '</strong>' + esc(r.t1) + (r.t2 ? '<br>' + esc(r.t2) : '') + '</button>';
  });
  if (estado.fecha === hoyMx()) {
    const m = minutosAhoraMx() - HORA_MIN * 60;
    if (m >= 0 && m <= total) html += '<div class="ahora" style="top:' + (m / total * 100) + '%"></div>';
  }
  return html + '</div>';
}

/* El panel de horarios sigue el reloj: se acomoda una hora antes de la actual y
   se va recorriendo solo. Si alguien lo mueve a mano, se respeta su posición y
   dos minutos después vuelve a seguir la hora. */
const scrollAgendas = { manual: false, pos: 0, programando: false, t: null };
function posicionPorHora(cont) {
  if (estado.fecha !== hoyMx()) return 0;
  const cuerpo = cont.querySelector('.agenda'), cab = cont.querySelector('.cab-sala');
  if (!cuerpo) return 0;
  const total = (HORA_MAX - HORA_MIN) * 60;
  const desde = Math.min(Math.max(minutosAhoraMx() - 60 - HORA_MIN * 60, 0), total);
  return Math.max(cuerpo.offsetTop - (cab ? cab.offsetHeight : 0) + (desde / total) * cuerpo.offsetHeight, 0);
}
function acomodarAgendas() {
  const cont = document.querySelector('.agendas-scroll');
  if (!cont) return;
  cont.addEventListener('scroll', function () {
    if (scrollAgendas.programando) return;
    scrollAgendas.manual = true;
    scrollAgendas.pos = cont.scrollTop;
    clearTimeout(scrollAgendas.t);
    scrollAgendas.t = setTimeout(function () { scrollAgendas.manual = false; }, 120000);
  }, { passive: true });
  scrollAgendas.programando = true;
  cont.scrollTop = scrollAgendas.manual ? scrollAgendas.pos : posicionPorHora(cont);
  setTimeout(function () { scrollAgendas.programando = false; }, 80);
}

// Aviso de horarios ocupados + armado de los menús de horario del formulario público.
// Compara cuánta gente viene contra los lugares de la sala. Sólo avisa, no impide enviar.
function avisoCupo(form) {
  const caja = document.getElementById('pista-cupo');
  if (!caja || !form.num_participantes) return;
  const sala = estado.salas.find(s => s.id === form.sala_id.value);
  const n = Number(form.num_participantes.value);
  if (!sala || !n || !Number(sala.capacidad) || n <= Number(sala.capacidad)) { caja.textContent = ''; caja.style.color = ''; return; }
  caja.textContent = 'Ojo: ' + sala.nombre + ' tiene ' + sala.capacidad + ' lugares y pusiste ' + n + ' personas.';
  caja.style.color = '#c0392b';
}
function actualizarDisponibilidad() {
  const form = document.getElementById('formSolicitud');
  if (!form) return;
  avisoCupo(form);
  const salaId = form.sala_id.value, fecha = form.fecha.value;
  const wrap = document.getElementById('dispo-wrap'), caja = document.getElementById('dispo-caja');
  const selI = document.getElementById('sel-inicio'), selF = document.getElementById('sel-fin');
  if (!salaId || !fecha) {
    wrap.style.display = 'none';
    selI.innerHTML = selF.innerHTML = '<option value="">Primero elige sala y fecha…</option>';
    return;
  }
  const bl = bloqueoDeDia(salaId, fecha);
  if (bl) {
    wrap.style.display = '';
    caja.className = 'aviso-caja alerta';
    caja.innerHTML = ic('info') + '<span><b>Esta sala no está disponible ese día.</b>' + (bl.motivo ? ' Motivo: ' + esc(bl.motivo) + '.' : '') + ' Elige otra fecha o sala.</span>';
    selI.innerHTML = selF.innerHTML = '<option value="">No disponible este día</option>';
    return;
  }
  const ocupadas = franjasOcupadas(salaId, fecha);
  if (ocupadas.length) {
    wrap.style.display = '';
    caja.className = 'aviso-caja';
    caja.innerHTML = ic('reloj') + '<span><b>Horarios ya ocupados en esta sala, en esta fecha:</b><br>' +
      ocupadas.map(f => aHora(f.ini) + ' – ' + aHora(f.fin) + (f.bloqueo ? ' (bloqueado)' : ' (ya reservado)')).join(' · ') + '</span>';
  } else {
    wrap.style.display = '';
    caja.className = 'aviso-caja';
    caja.innerHTML = ic('check') + '<span>La sala está libre todo el día en esa fecha.</span>';
  }
  const minimo = primerBloqueDe(fecha);
  if (minimo !== null && minimo > HORA_MAX * 60 - PASO) {
    caja.className = 'aviso-caja alerta';
    caja.innerHTML = ic('reloj') + '<span>Por hoy ya no quedan horarios disponibles (se atiende hasta las ' + HORA_MAX + ':00). Elige otra fecha.</span>';
  }
  const ops = opcionesHorario(ocupadas, selI.value, selF.value, minimo);
  selI.innerHTML = ops.ini; selF.innerHTML = ops.fin;
}

async function enviarSolicitud(form) {
  const err = document.getElementById('errorForm'), boton = document.getElementById('btnEnviar');
  const falla = m => { err.textContent = m; err.style.display = 'block'; boton.disabled = false; boton.textContent = 'Enviar solicitud'; };
  err.style.display = 'none';
  if (!form.checkValidity()) { form.reportValidity(); return; }
  const d = Object.fromEntries(new FormData(form).entries());
  const area = valorConOtro(form, 'area'), proyecto = valorConOtro(form, 'proyecto');
  if (!area) return falla('Falta indicar el área.');
  if (!proyecto) return falla('Falta indicar el proyecto.');
  if (d.fecha < hoyMx()) return falla('Esa fecha ya pasó. Elige el día de hoy o una fecha próxima.');
  const i = toMin(d.inicio), f = toMin(d.fin);
  if (i === null || f === null) return falla('Falta elegir el horario de inicio y de término.');
  if (i >= f) return falla('El horario de término debe ser después del horario de inicio.');
  const minimoHoy = primerBloqueDe(d.fecha);
  if (minimoHoy !== null && i < minimoHoy) return falla('Ese horario ya pasó. Elige uno de los siguientes.');
  if (bloqueoDeDia(d.sala_id, d.fecha)) return falla('Esa sala no está disponible en esa fecha. Elige otra fecha o sala.');
  const choque = franjasOcupadas(d.sala_id, d.fecha).some(fr => i < fr.fin && f > fr.ini);
  if (choque) return falla('Ese horario ya está ocupado en esta sala — elige otro, o revisa arriba los horarios ya tomados.');

  boton.disabled = true; boton.innerHTML = 'Enviando…';
  try {
    const r = await enviar({
      accion:'solicitar', sala_id:d.sala_id, fecha:d.fecha, inicio:d.inicio, fin:d.fin,
      nombre:String(d.nombre).trim(), tema:String(d.tema).trim(), participantes:String(d.participantes || '').trim(),
      num_participantes:String(d.num_participantes || ''), area:area, proyecto:proyecto
    });
    if (!r.ok) return falla(r.error || 'No se pudo registrar la solicitud.');
    estado.enviado = true;
    pintarEnviado();
  } catch (e) {
    falla('No se pudo confirmar el envío (el servidor tardó demasiado). Espera un momento y revisa si tu solicitud ya aparece en la agenda antes de volver a intentarlo, para no mandarla dos veces.');
  }
}

/* ------------------------------------------------------------
   TABLERO · filas compartidas por el panel y la proyección
   ------------------------------------------------------------ */
function filasTablero(gestionable) {
  const bloqueosFila = estado.bloqueos
    .filter(b => gestionable || b.mostrar_tablero)
    .reduce((acc, b) => acc.concat(b.fechas.map(f => ({ esBloqueo:true, bloqueoId:b.id, sala_id:b.sala_id, fecha:f, inicio:b.inicio, fin:b.fin, motivo:b.motivo, descripcion:b.descripcion, mostrar_tablero:b.mostrar_tablero }))), []);
  let lista = estado.reservaciones
    .filter(r => EN_TABLERO.indexOf(r.estatus) !== -1 && (gestionable || r.mostrar_proyeccion))
    .concat(bloqueosFila);
  if (gestionable) {
    if (estado.desde) lista = lista.filter(r => r.fecha >= estado.desde);
    if (estado.hasta) lista = lista.filter(r => r.fecha <= estado.hasta);
  } else {
    const hoy = hoyMx();
    lista = lista.filter(r => r.fecha >= hoy);
  }
  lista.sort((a, b) => (a.fecha + (a.inicio || '')).localeCompare(b.fecha + (b.inicio || '')));

  if (!lista.length) {
    return '<div class="fila"><div class="vacio">' +
      ((gestionable && (estado.desde || estado.hasta)) ? 'No hay reuniones en ese rango de fechas.' : 'No hay reuniones programadas por el momento.') +
      '</div></div>';
  }
  return lista.map(r => {
    const horario = (r.inicio || r.fin) ? esc(r.inicio || '—') + ' – ' + esc(r.fin || '—') : 'Todo el día';
    if (r.esBloqueo) {
      return '<div class="fila bloqueada">' +
        '<div class="celda hora" data-et="Fecha / horario">' + esc(fmtFecha(r.fecha)) + '<br>' + horario + '</div>' +
        '<div class="celda sala" data-et="Sala">' + esc(nombreSala(r.sala_id)) + '</div>' +
        '<div class="celda" data-et="Área">—</div>' +
        '<div class="celda" data-et="Título">' + esc(r.descripcion || 'Sala bloqueada') +
          (r.motivo ? '<div class="sub-dato">' + ic('info') + esc(r.motivo) + '</div>' : '') + '</div>' +
        '<div class="celda" data-et="Proyecto">—</div>' +
        '<div class="celda estatus" data-et="Estatus"><span style="color:var(--st-cancelada);border-color:var(--st-cancelada)">BLOQUEADA</span>' +
          (gestionable ? '<div class="sub-dato">' + ic('info') + 'Se administra abajo, en “Bloquear fechas”.</div>' : '') + '</div>' +
        '</div>';
    }
    const e = ESTATUS[estatusVisible(r)] || ESTATUS.aceptada;
    const gestion = gestionable ? '<div class="celda gestion" data-et="Cambiar">' +
      '<select data-estatus-de="' + esc(r.id) + '" aria-label="Cambiar estatus" title="Lo que diga aquí manda sobre el estatus automático">' +
      ['aceptada','en_curso','concluida','cancelada'].map(k => '<option value="' + k + '"' + (r.estatus === k ? ' selected' : '') + '>' + ESTATUS[k].etiqueta.charAt(0) + ESTATUS[k].etiqueta.slice(1).toLowerCase() + '</option>').join('') +
      '</select>' +
      '<button class="btn-icono" data-proyeccion="' + esc(r.id) + '" title="' + (r.mostrar_proyeccion ? 'Se ve en la proyección. Clic para ocultarla.' : 'Oculta en la proyección. Clic para mostrarla.') + '">' + ic(r.mostrar_proyeccion ? 'ojo' : 'ojoNo') + '</button>' +
      '<button class="btn-icono" data-editar="' + esc(r.id) + '" title="Editar">' + ic('editar') + '</button>' +
      '<button class="btn-icono peligro" data-borrar="' + esc(r.id) + '" title="Eliminar">' + ic('basura') + '</button>' +
      '</div>' : '';
    const gente = htmlGente(r);
    const verParticipantes = r.mostrar_participantes && gente;
    return '<div class="fila">' +
      '<div class="celda hora" data-et="Fecha / horario">' + esc(fmtFecha(r.fecha)) + '<br>' + horario + '</div>' +
      '<div class="celda sala" data-et="Sala">' + esc(nombreSala(r.sala_id)) + '</div>' +
      '<div class="celda" data-et="Área">' + esc(r.area || '—') + '</div>' +
      '<div class="celda" data-et="Título">' + esc(r.tema || '—') +
        (verParticipantes ? '<div class="sub-dato">' + ic('gente') + gente + '</div>' : '') +
        (gestionable && r.nombre ? '<div class="sub-dato">' + ic('info') + 'Solicitó: ' + esc(r.nombre) + '</div>' : '') +
        (gestionable && r.notas ? '<div class="sub-dato">' + ic('info') + esc(r.notas) + '</div>' : '') +
        (enlaceSeguro(r.link_doc) ? '<div class="sub-dato">' + ic('liga') + '<a href="' + esc(enlaceSeguro(r.link_doc)) + '" target="_blank" rel="noopener" style="color:inherit">Enlace de consulta</a></div>' : '') +
        (gestionable && enlaceSeguro(r.link_admin) ? '<div class="sub-dato">' + ic('candado') + '<a href="' + esc(enlaceSeguro(r.link_admin)) + '" target="_blank" rel="noopener" style="color:inherit">Enlace personal</a></div>' : '') +
      '</div>' +
      '<div class="celda" data-et="Proyecto">' + esc(r.proyecto || '—') + '</div>' +
      '<div class="celda estatus" data-et="Estatus"><span style="color:' + e.color + ';border-color:' + e.color + '">' + e.etiqueta + '</span>' +
        (gestionable && !r.mostrar_proyeccion ? '<div class="sub-dato">' + ic('ojoNo') + 'Oculta en proyección</div>' : '') + '</div>' +
      gestion +
      '</div>';
  }).join('');
}
function encabezadoTablero(gestionable) {
  return '<div class="fila encabezado">' +
    '<div class="celda">Fecha / Horario</div><div class="celda">Sala</div><div class="celda">Área</div>' +

      '<div class="campo todo"><label>Tipo de bloqueo</label><div style="display:flex;gap:18px;flex-wrap:wrap">' +

      '<label class="marca-check"><input type="radio" name="tipo" value="mes"' + (esMes ? ' checked' : '') + '> Por mes (días de la semana)</label>' +
      '</div></div>' +
      '<div class="campo todo" id="bloq-dia"' + (esMes ? ' style="display:none"' : '') + '><label>Fecha</label><input type="date" name="fecha" value="' + esc(b.fechas[0] || '') + '"></div>' +
      '<div class="campo todo" id="bloq-mes"' + (esMes ? '' : ' style="display:none"') + '><label>Mes</label><input type="month" name="mes" value="' + esc(b.mes) + '">' +
      '<label style="margin-top:10px">Días de la semana</label><div style="display:flex;gap:12px;flex-wrap:wrap">' +
      DIAS_SEMANA.map((d, i) => '<label class="marca-check"><input type="checkbox" name="dia" value="' + i + '"' + (b.dias.indexOf(String(i)) !== -1 ? ' checked' : '') + '> ' + d + '</label>').join('') +
      '</div></div>' +
      '<div class="campo todo"><label class="marca-check"><input type="checkbox" name="todoDia" id="bloq-todo"' + (b.inicio ? '' : ' checked') + '> Bloquear todo el día</label></div>' +
      '<div class="campo"><label>Desde</label><input type="time" name="inicio" step="1800" value="' + esc(b.inicio) + '"' + (b.inicio ? '' : ' disabled') + '></div>' +
      '<div class="campo"><label>Hasta</label><input type="time" name="fin" step="1800" value="' + esc(b.fin) + '"' + (b.inicio ? '' : ' disabled') + '></div>' +
      campoTexto('motivo', 'Motivo (corto)', b.motivo, 'maxlength="60" placeholder="Mantenimiento, evento…"') +
      campoTexto('descripcion', 'Cómo se ve en el tablero', b.descripcion, 'maxlength="90" placeholder="Sala bloqueada"') +
      '<div class="campo todo"><label class="marca-check"><input type="checkbox" name="mostrar_tablero"' + (b.mostrar_tablero ? ' checked' : '') + '> Mostrar este bloqueo en la pantalla de proyección</label></div>' +
      '</div><div class="acciones-form"><button class="btn btn-oro" type="submit">' + ic('check') + 'Guardar bloqueo</button>' +
      '<button class="btn" type="button" id="btnCancelarForm">Cancelar</button></div>' +

  html += estado.bloqueos.length ? estado.bloqueos.map(b =>
    '<div class="fila-lista"><span><b>' + esc(nombreSala(b.sala_id)) + '</b> · ' +
    (b.inicio ? esc(b.inicio) + '–' + esc(b.fin) : 'todo el día') + ' · ' +
    (b.fechas.length > 3 ? b.fechas.length + ' fechas (' + esc(fmtFecha(b.fechas[0])) + ' …)' : b.fechas.map(f => esc(fmtFecha(f))).join(', ')) +
    (b.motivo ? ' · ' + esc(b.motivo) : '') + '</span>' +
    '<span class="acc"><button class="btn-icono" data-editar-bloqueo="' + esc(b.id) + '" title="Editar">' + ic('editar') + '</button>' +
    '<button class="btn-icono peligro" data-borrar-bloqueo="' + esc(b.id) + '" title="Eliminar">' + ic('basura') + '</button></span></div>').join('')
    : '<div class="desc" style="margin:0">No hay bloqueos registrados.</div>';
  return html + '</div>';
}
// Un bloqueo "por mes" se guarda como la lista de fechas concretas que cubre.
function fechasDelMes(mes, dias) {
  const p = String(mes || '').split('-');
  if (p.length !== 2) return [];
  const anio = Number(p[0]), m = Number(p[1]);
  const out = [], ultimo = new Date(anio, m, 0).getDate();
  for (let d = 1; d <= ultimo; d++) {
    const f = new Date(anio, m - 1, d);
    if (dias.indexOf(String(f.getDay())) !== -1) out.push(p[0] + '-' + p[1] + '-' + String(d).padStart(2, '0'));
  }
  return out;
}

/* ------------------------------------------------------------
   Confirmación propia (sin ventanas del navegador)
   ------------------------------------------------------------ */
function confirmar(mensaje, textoOk) {
  return new Promise(resolve => {
    const cont = document.getElementById('modal');
    cont.innerHTML = '<div class="fondo-modal"><div class="modal" style="max-width:400px">' +
      '<h3>¿Seguro?</h3><div class="dato">' + esc(mensaje) + '</div>' +
      '<div class="acciones-form" style="justify-content:flex-end">' +
      '<button class="btn" id="conf-no">Cancelar</button>' +
      '<button class="btn btn-peligro" id="conf-si">' + esc(textoOk || 'Sí, continuar') + '</button></div></div></div>';
    const cerrar = v => { cont.innerHTML = ''; resolve(v); };
    document.getElementById('conf-si').onclick = () => cerrar(true);
    document.getElementById('conf-no').onclick = () => cerrar(false);
  });
}

/* ------------------------------------------------------------
   Router de vistas
   ------------------------------------------------------------ */
function pintar() {
  if (VISTA === 'tablero') return pintarKiosko();
  if (VISTA === 'solicitud') return pintarSolicitud();
  if (VISTA === 'admin') return pintarAdmin();
  return pintarSalas();
}
// Si el servidor ya devolvió los datos nuevos, no se le vuelve a preguntar:
// eso ahorra un viaje completo a Google en cada cambio.
async function recargarYPintar(respuesta) {
  if (!aplicarDatos(respuesta)) {
    try { await cargar(); } catch (e) { aviso('No se pudo refrescar la información.'); }
  }
  pintar();
}

   Clics
   ------------------------------------------------------------ */
document.addEventListener('click', async e => {
  const t = e.target;
  const boton = sel => t.closest('[' + sel + ']');

  // cerrar modal
  if (t.hasAttribute && t.hasAttribute('data-cerrar') && (t.tagName === 'BUTTON' || t.classList.contains('fondo-modal'))) {
    document.getElementById('modal').innerHTML = ''; return;
  }
  // --- vista pública ---
  const bloque = boton('data-res');
  if (bloque) { modalDetalle(bloque.getAttribute('data-res')); return; }

  // --- panel ---
  const verClave = t.closest && t.closest('#btn-ver-clave');
  if (verClave) {
    const campo = document.getElementById('campo-clave');
    const visible = campo.type === 'text';
    campo.type = visible ? 'password' : 'text';
    verClave.innerHTML = ic(visible ? 'ojo' : 'ojoNo');
    verClave.setAttribute('aria-label', visible ? 'Mostrar la contraseña' : 'Ocultar la contraseña');
    verClave.setAttribute('title', visible ? 'Mostrar la contraseña' : 'Ocultar la contraseña');
    campo.focus();
    return;
  }
  if (t.id === 'btnSalir') {
    estado.clave = ''; olvidarClave();
    location.href = urlBase(); return;
  }
  if (t.id === 'btnNueva') { estado.editandoId = null; estado.formAbierto = 'reservacion'; pintarAdmin(); window.scrollTo(0, 0); return; }
  if (t.id === 'btnCancelarForm') { estado.formAbierto = ''; estado.editandoId = null; estado.editandoItem = null; pintarAdmin(); return; }
  if (t.id === 'btnQuitarFiltro') { estado.desde = ''; estado.hasta = ''; pintarAdmin(); return; }
  if (t.id === 'btnNuevoBloqueo') { estado.editandoItem = null; estado.formAbierto = 'bloqueo'; pintarAdmin(); return; }

  const editar = boton('data-editar');
  if (editar) { estado.editandoId = editar.getAttribute('data-editar'); estado.formAbierto = 'reservacion'; pintarAdmin(); window.scrollTo(0, 0); return; }

  const aceptar = boton('data-aceptar');
  if (aceptar) {
    const r = estado.reservaciones.find(x => x.id === aceptar.getAttribute('data-aceptar'));
    if (!r) return;
    const ch = conflictos(r);
    if (ch.length && !(await confirmar('Esta solicitud se encima con ' + ch.join('; ') + '. ¿Aceptarla de todos modos?', 'Sí, aceptar'))) return;
    r.estatus = 'aceptada'; pintarAdmin();          // se ve el cambio de inmediato
    const resp = await enviarAdmin({ accion:'estatus', id:r.id, estatus:'aceptada' });
    if (resp) aviso('Aceptada — ya aparece en el tablero.');
    await recargarYPintar(resp); return;
  }
  const rechazar = boton('data-rechazar');
  if (rechazar) {
    if (!(await confirmar('¿Rechazar esta solicitud?', 'Sí, rechazar'))) return;
    const idR = rechazar.getAttribute('data-rechazar');
    const rr = estado.reservaciones.find(x => x.id === idR);
    if (rr) { rr.estatus = 'rechazada'; pintarAdmin(); }
    const resp = await enviarAdmin({ accion:'estatus', id:idR, estatus:'rechazada' });
    if (resp) aviso('Solicitud rechazada.');
    await recargarYPintar(resp); return;
  }
  const reactivar = boton('data-reactivar');
  if (reactivar) {
    const idV = reactivar.getAttribute('data-reactivar');
    const rv = estado.reservaciones.find(x => x.id === idV);
    if (rv) { rv.estatus = 'pendiente'; pintarAdmin(); }
    const resp = await enviarAdmin({ accion:'estatus', id:idV, estatus:'pendiente' });
    if (resp) aviso('Volvió a solicitudes pendientes.');
    await recargarYPintar(resp); return;
  }
  const borrar = boton('data-borrar');
  if (borrar) {
    if (!(await confirmar('Esto borra la reservación de la hoja de cálculo y no se puede deshacer.', 'Sí, eliminar'))) return;
    const idB = borrar.getAttribute('data-borrar');
    estado.reservaciones = estado.reservaciones.filter(x => x.id !== idB); pintarAdmin();
    const resp = await enviarAdmin({ accion:'eliminar', id:idB });
    if (resp) aviso('Eliminada.');
    await recargarYPintar(resp); return;
  }
  const proy = boton('data-proyeccion');
  if (proy) {
    const r = estado.reservaciones.find(x => x.id === proy.getAttribute('data-proyeccion'));
    if (!r) return;
    const nuevo = !r.mostrar_proyeccion;
    r.mostrar_proyeccion = nuevo; pintarAdmin();
    const resp = await enviarAdmin({ accion:'editar', id:r.id, mostrar_proyeccion: nuevo });
    if (resp) aviso(nuevo ? 'Visible en la pantalla de proyección.' : 'Oculta en la pantalla de proyección.');
    await recargarYPintar(resp); return;
  }
  // bloqueos
  const edBl = boton('data-editar-bloqueo');
  if (edBl) {
    estado.editandoItem = estado.bloqueos.find(b => b.id === edBl.getAttribute('data-editar-bloqueo')) || null;
    estado.formAbierto = 'bloqueo'; pintarAdmin(); return;
  }
  const bgBl = boton('data-borrar-bloqueo');
  if (bgBl) {
    if (!(await confirmar('¿Quitar este bloqueo? La sala vuelve a quedar disponible en esas fechas.', 'Sí, quitar'))) return;
    const idBl = bgBl.getAttribute('data-borrar-bloqueo');
    estado.bloqueos = estado.bloqueos.filter(x => x.id !== idBl); pintarAdmin();
    const resp = await enviarAdmin({ accion:'bloqueo_eliminar', id:idBl });
    if (resp) aviso('Bloqueo eliminado.');
    await recargarYPintar(resp); return;
  }
  // catálogos
  const nuevoCat = boton('data-nuevo-cat');
  if (nuevoCat) { estado.editandoItem = null; estado.formAbierto = 'cat:' + nuevoCat.getAttribute('data-nuevo-cat'); pintarAdmin(); return; }
  const edCat = boton('data-editar-cat');
  if (edCat) {
    const lista = edCat.getAttribute('data-editar-cat'), id = edCat.getAttribute('data-id');
    if (lista === 'salas') {
      const s = estado.salas.find(x => x.id === id);
      estado.editandoItem = s ? { id:s.id, nombre:s.nombre, capacidad:s.capacidad } : null;
    } else {
      estado.editandoItem = { id:id, nombre:id, capacidad:'' };
    }
    estado.formAbierto = 'cat:' + lista; pintarAdmin(); return;
  }
  const bgCat = boton('data-borrar-cat');
  if (bgCat) {
    const lista = bgCat.getAttribute('data-borrar-cat'), id = bgCat.getAttribute('data-id');
    if (!(await confirmar(lista === 'salas'
      ? 'Se quita la sala del formulario. Las reservaciones que ya tenía se quedan en la hoja.'
      : 'Se quita de la lista. Si alguna reservación lo sigue usando, va a seguir apareciendo ahí.', 'Sí, quitar'))) return;
    const resp = await enviarAdmin({ accion:'catalogo', lista:lista, op:'eliminar', id:id });
    if (resp) aviso('Listo.');
    await recargarYPintar(resp); return;
  }
});

/* ------------------------------------------------------------
   Envío de formularios
   ------------------------------------------------------------ */
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  // Con getAttribute, no con f.id: si el formulario tiene un campo que se llame
  // "id", ese campo tapa la propiedad y la comparación fallaría en silencio.
  const idForm = f.getAttribute('id');
  const err = f.querySelector('#errorForm');
  const falla = m => { if (err) { err.textContent = m; err.style.display = 'block'; } else aviso(m); };

  // --- clave del administrador ---
  if (idForm === 'formClave') {
    const btn = f.querySelector('[type=submit]');
    btn.disabled = true; if (err) err.style.display = 'none';
    try {
      const clave = f.clave.value;
      const r = await enviar({ accion:'verificar', clave:clave });
      if (!r.ok) { falla(r.error || 'La clave no es correcta.'); btn.disabled = false; return; }
      estado.clave = clave;
      recordarClave(clave);
      await recargarYPintar();
    } catch (x) { falla('No se pudo conectar. Intenta de nuevo.'); btn.disabled = false; }
    return;
  }
  // --- solicitud pública ---
  if (idForm === 'formSolicitud') { enviarSolicitud(f); return; }

  // --- filtro de fechas del tablero ---
  if (idForm === 'formFiltro') { estado.desde = f.desde.value; estado.hasta = f.hasta.value; pintarAdmin(); return; }

  // --- alta/edición de reservación (panel) ---
  if (idForm === 'formReservacion') {
    if (!f.checkValidity()) { f.reportValidity(); return; }
    const d = Object.fromEntries(new FormData(f).entries());
    const i = toMin(d.inicio), fin = toMin(d.fin);
    if (i === null || fin === null) return falla('Falta el horario.');
    if (i >= fin) return falla('El horario de término debe ser después del de inicio.');
    const cuerpo = {
      accion: estado.editandoId ? 'editar' : 'crear', id: estado.editandoId || '',
      sala_id:d.sala_id, fecha:d.fecha, inicio:d.inicio, fin:d.fin, nombre:String(d.nombre).trim(),
      tema:String(d.tema).trim(), participantes:String(d.participantes || '').trim(),
      num_participantes:String(d.num_participantes || ''),
      area: valorConOtro(f, 'area'), proyecto: valorConOtro(f, 'proyecto'),
      estatus:d.estatus, mostrar_proyeccion: !!d.mostrar_proyeccion, mostrar_participantes: !!d.mostrar_participantes
    };
    const choques = conflictos({ id:estado.editandoId || '', sala_id:cuerpo.sala_id, fecha:cuerpo.fecha, inicio:cuerpo.inicio, fin:cuerpo.fin });
    if (choques.length && ['aceptada','en_curso','pendiente'].indexOf(cuerpo.estatus) !== -1 &&
        !(await confirmar('Se encima con ' + choques.join('; ') + '. ¿Guardar de todos modos?', 'Sí, guardar'))) return;
    const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Guardando…';
    const resp = await enviarAdmin(cuerpo);
    if (resp) {
      aviso(estado.editandoId ? 'Cambios guardados.' : 'Reunión agregada.');
      estado.formAbierto = ''; estado.editandoId = null;
    } else { btn.disabled = false; btn.textContent = 'Guardar'; }
    await recargarYPintar(resp); return;
  }

  // --- bloqueo ---
  if (idForm === 'formBloqueo') {
    const d = Object.fromEntries(new FormData(f).entries());
    const tipo = d.tipo || 'dia';
    let fechas = [];
    if (tipo === 'mes') {
      const dias = Array.prototype.slice.call(f.querySelectorAll('[name=dia]:checked')).map(x => x.value);
      if (!d.mes) return falla('Elige el mes.');
      if (!dias.length) return falla('Marca al menos un día de la semana.');
      fechas = fechasDelMes(d.mes, dias);
      if (!fechas.length) return falla('Ese mes no tiene esos días.');
      d.dias = dias.join(',');
    } else {
      if (!d.fecha) return falla('Elige la fecha.');
      fechas = [d.fecha];
    }
    const todoDia = !!d.todoDia;
    if (!todoDia) {
      if (!d.inicio || !d.fin) return falla('Pon el horario, o marca “Bloquear todo el día”.');
      if (toMin(d.inicio) >= toMin(d.fin)) return falla('La hora final debe ser después de la inicial.');
    }
    const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Guardando…';
    const ok = await enviarAdmin({
      accion:'bloqueo_guardar', id: estado.editandoItem ? estado.editandoItem.id : '',
      sala_id:d.sala_id, tipo:tipo, mes:d.mes || '', dias:d.dias || '', fechas:fechas.join(','),
      inicio: todoDia ? '' : d.inicio, fin: todoDia ? '' : d.fin,
      motivo:String(d.motivo || '').trim(), descripcion:String(d.descripcion || '').trim(),
      mostrar_tablero: !!d.mostrar_tablero
    });
    if (ok) { aviso('Bloqueo guardado.'); estado.formAbierto = ''; estado.editandoItem = null; } else { btn.disabled = false; btn.textContent = 'Guardar bloqueo'; }
    await recargarYPintar(ok); return;
  }

  // --- catálogos ---
  if (idForm === 'formCatalogo') {
    const d = Object.fromEntries(new FormData(f).entries());
    if (!String(d.nombre || '').trim()) return falla('Escribe el nombre.');
    const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Guardando…';
    const ok = await enviarAdmin({ accion:'catalogo', lista:f.getAttribute('data-lista'), op:'guardar', id:d.item_id || '', nombre:String(d.nombre).trim(), capacidad:d.capacidad || '' });
    if (ok) { aviso('Guardado.'); estado.formAbierto = ''; estado.editandoItem = null; } else { btn.disabled = false; btn.textContent = 'Guardar'; }
    await recargarYPintar(ok); return;
  }
});

/* ------------------------------------------------------------
   Acceso escondido al panel
   ------------------------------------------------------------ */
//  · Cinco clics seguidos en el logo (en menos de 3 segundos).
//  · O el atajo Ctrl + Alt + A en cualquier parte de la página.
let golpes = [];
document.addEventListener('click', e => {
  if (!e.target.closest || !e.target.closest('#logo-attrapi')) return;
  const ahora = Date.now();
  golpes = golpes.filter(t => ahora - t < 3000).concat(ahora);
  if (golpes.length >= 5) { golpes = []; location.href = '?admin=1'; }
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.altKey && (e.key === 'a' || e.key === 'A')) { e.preventDefault(); location.href = '?admin=1'; }
});

/* ------------------------------------------------------------
   Modo tablero automático
   ------------------------------------------------------------ */
//  En la agenda de salas: si nadie toca nada durante 30 segundos, la pantalla
//  se pasa sola al tablero. Vuelve a la agenda en cuanto alguien se mueve.
//  El tablero abierto a propósito (?tablero=1, sin &auto=1) no se mueve de ahí,
//  para que se pueda dejar proyectado en la tele.
const INACTIVIDAD_TABLERO = 30000;
let ultimaActividad = Date.now();
let ultimoX = null, ultimoY = null;
['mousedown', 'keydown', 'wheel', 'touchstart', 'scroll', 'focusin'].forEach(function (ev) {
  document.addEventListener(ev, function () { ultimaActividad = Date.now(); }, { passive: true });
});
// El mouse quieto también dispara "mousemove" cuando la pantalla se redibuja debajo.
// Sólo cuenta como actividad si el puntero de veras cambió de lugar.
document.addEventListener('mousemove', function (e) {
  if (e.clientX === ultimoX && e.clientY === ultimoY) return;
  ultimoX = e.clientX; ultimoY = e.clientY;
  ultimaActividad = Date.now();
}, { passive: true });
// Al volver a la pestaña se cuentan los 10 segundos desde ese momento.
document.addEventListener('visibilitychange', function () { ultimaActividad = Date.now(); });
if (VISTA === 'salas') {
  setInterval(function () {
    // Con un detalle abierto o con la pestaña en segundo plano no se cambia.
    if (document.hidden || document.getElementById('modal').innerHTML) { ultimaActividad = Date.now(); return; }
    if (Date.now() - ultimaActividad >= INACTIVIDAD_TABLERO) location.href = '?tablero=1&auto=1';
  }, 1000);
}
if (VISTA === 'tablero' && parametros.has('auto')) {
  const arranque = Date.now();
  const volver = function () { if (Date.now() - arranque > 1200) location.href = urlBase(); };
  ['mousemove', 'mousedown', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, volver, { passive: true });
  });
}

/* ------------------------------------------------------------
   Arranque
   ------------------------------------------------------------ */
function errorCarga() {
  document.getElementById('raiz').innerHTML = '<div class="hoja"><div class="panel">' +
    '<h3>No se pudieron cargar los datos</h3>' +
    '<div class="desc" style="margin-top:6px">Revisa que la URL de Apps Script en <code>API_URL</code> sea la correcta y que la aplicación web esté implementada con acceso <b>“Cualquier usuario”</b>.</div>' +
    '<button class="btn btn-vino" onclick="location.reload()">Volver a intentar</button></div></div>';
}
// Mientras alguien escribe no se redibuja la pantalla, para no borrarle lo que lleva.
function ocupadoEscribiendo() {
  if (document.getElementById('modal').innerHTML) return true;
  if (estado.formAbierto) return true;
  if (VISTA === 'solicitud') return true;
  const a = document.activeElement;
  return !!(a && (a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA'));
}
(async function () {
  if (API_URL.indexOf('http') !== 0) {
    document.getElementById('raiz').innerHTML = '<div class="hoja"><div class="panel">Falta pegar la URL de Apps Script en la constante <code>API_URL</code> de este archivo.</div></div>';
    return;
  }
  estado.clave = claveGuardada();
  const salaParam = parametros.get('sala'), fechaParam = parametros.get('fecha');
  if (salaParam) estado.salaId = salaParam;
  if (fechaParam) estado.fecha = fechaParam;
  try { await cargar(); } catch (x) { errorCarga(); return; }
  pintar();

  // Refresco automático: la pantalla de proyección cada 20 s, lo demás cada minuto.
  setInterval(async () => {
    if (ocupadoEscribiendo()) return;
    try { await cargar(); pintar(); } catch (x) {}
  }, VISTA === 'tablero' ? 20000 : 60000);
  if (VISTA === 'tablero') setInterval(actualizarReloj, 15000);
  // El panel de horarios se recorre solo cada minuto, aunque no lleguen datos nuevos.
  if (VISTA === 'salas') setInterval(function () { if (!document.hidden) pintarSalas(); }, 60000);
})();
</script>
